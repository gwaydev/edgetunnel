name: Upstream Sync

permissions:
  contents: write

# 仅允许在 GitHub Actions 页面手动触发，避免定时同步覆盖本项目的定制代码。
on:
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6

      - name: Sync upstream changes
        id: sync
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          upstream_sync_repo: cmliu/edgetunnel
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 上游同步失败。请查看上一执行步骤的详细日志，并手动处理代码冲突或工作流权限问题。"
          echo "[Error] Upstream sync failed. Check the previous step logs and manually resolve conflicts or workflow permission issues."
          exit 1

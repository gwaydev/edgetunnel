name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out edgetunnel
        uses: actions/checkout@v4
        with:
          path: edgetunnel

      - name: Check out Xboard contract fixture
        uses: actions/checkout@v4
        with:
          repository: gwaydev/Xboard
          path: Xboard

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edgetunnel/package-lock.json

      - name: Reject tracked secrets and runtime artifacts
        shell: bash
        working-directory: edgetunnel
        run: |
          violations="$({
            git ls-files | awk '
              /(^|\/)\.env$/ ||
              /(^|\/)\.wrangler(\/|$)/ ||
              /(^|\/)tmp-wrangler-dry-run(\/|$)/ {
                print
              }
            '
          })"
          if [ -n "$violations" ]; then
            printf '%s\n' 'Forbidden tracked paths detected:'
            printf '%s\n' "$violations"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: edgetunnel

      - name: Build worker bundle
        run: npm run build
        working-directory: edgetunnel

      - name: Check worker syntax
        run: npm run syntax
        working-directory: edgetunnel

      - name: Run worker tests
        run: npm test
        working-directory: edgetunnel

      - name: Run credential-free deploy dry-run
        run: npm run deploy:dry
        working-directory: edgetunnel
